<!-- src/web/templates/student_dashboard.html -->
{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2>📊 Student Wellness Dashboard</h2>
        <p>Welcome back, <strong>{{ session.user_id }}</strong> 👋</p>
    </div>
</div>

<!-- Stats Cards -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card h-100" id="riskCard" style="border: none; transition: all 0.5s ease;">
            <div class="card-body" id="riskCardBody" style="border-radius: 10px; padding: 20px; transition: all 0.5s ease;">
                <h5 class="card-title" style="color: rgba(255,255,255,0.9); font-weight: 600;">Current Risk Level</h5>
                <h2 class="display-4" id="riskLevel" style="font-weight: 700; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2);">-</h2>
                <p class="mb-0" id="riskScore" style="font-weight: 600; color: rgba(255,255,255,0.9);"></p>
                <div id="riskIndicator" style="margin-top: 10px; font-size: 14px; color: rgba(255,255,255,0.8);"></div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-info h-100">
            <div class="card-body">
                <h5 class="card-title">Sleep (7-day avg)</h5>
                <h2 class="display-4" id="avgSleep">-</h2>
                <p class="mb-0" id="sleepQuality"></p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning h-100">
            <div class="card-body">
                <h5 class="card-title">HRV (7-day avg)</h5>
                <h2 class="display-4" id="avgHRV">-</h2>
                <p class="mb-0" id="hrvStatus"></p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-secondary h-100">
            <div class="card-body">
                <h5 class="card-title">Days Monitored</h5>
                <h2 class="display-4" id="daysMonitored">-</h2>
                <p class="mb-0" id="monitorNote"></p>
            </div>
        </div>
    </div>
</div>

<!-- Charts and Recommendations -->
<div class="row mb-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">📈 Risk Trend (Last 7 Days)</h5>
            </div>
            <div class="card-body">
                <div id="riskChart" style="height: 300px;"></div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">💡 Recommendations</h5>
            </div>
            <div class="card-body">
                <ul class="list-group" id="recommendationsList">
                    <li class="list-group-item">Loading...</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<!-- Recent Messages -->
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">💬 Recent Messages</h5>
            </div>
            <div class="card-body">
                <div id="messagesList"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
// =============================================
// COMPLETE CODE - WITH COLORED RISK BOX
// =============================================

// Color configurations for each risk level
const RISK_COLORS = {
    HIGH: {
        background: 'linear-gradient(135deg, #dc3545 0%, #c0392b 100%)',
        boxShadow: '0 4px 20px rgba(220, 53, 69, 0.4)',
        textColor: '#ffffff',
        icon: '🔴',
        status: 'Urgent Attention Required',
        borderColor: '#dc3545'
    },
    MEDIUM: {
        background: 'linear-gradient(135deg, #ffc107 0%, #f39c12 100%)',
        boxShadow: '0 4px 20px rgba(255, 193, 7, 0.4)',
        textColor: '#ffffff',
        icon: '🟡',
        status: 'Moderate - Monitor Closely',
        borderColor: '#ffc107'
    },
    LOW: {
        background: 'linear-gradient(135deg, #28a745 0%, #1e7e34 100%)',
        boxShadow: '0 4px 20px rgba(40, 167, 69, 0.4)',
        textColor: '#ffffff',
        icon: '🟢',
        status: 'Good - Keep It Up!',
        borderColor: '#28a745'
    }
};

// This function generates random data with ALL risk levels
function generateRandomData() {
    // Generate a random number between 0 and 1
    const rand = Math.random();
    
    let risk, riskScore, avgSleep, avgHRV, daysMonitored;
    
    // 33.3% chance for each risk level
    if (rand < 0.333) {
        // HIGH RISK
        risk = 'HIGH';
        riskScore = (Math.random() * 0.3 + 0.65).toFixed(2);  // 0.65 - 0.95
        avgSleep = (Math.random() * 2 + 3.5).toFixed(1);      // 3.5 - 5.5 hours
        avgHRV = Math.floor(Math.random() * 15 + 30);         // 30 - 45 ms
        daysMonitored = Math.floor(Math.random() * 10 + 5);   // 5 - 15 days
    } else if (rand < 0.666) {
        // MEDIUM RISK
        risk = 'MEDIUM';
        riskScore = (Math.random() * 0.3 + 0.30).toFixed(2);  // 0.30 - 0.60
        avgSleep = (Math.random() * 2 + 5.5).toFixed(1);      // 5.5 - 7.5 hours
        avgHRV = Math.floor(Math.random() * 15 + 46);         // 46 - 61 ms
        daysMonitored = Math.floor(Math.random() * 15 + 10);  // 10 - 25 days
    } else {
        // LOW RISK
        risk = 'LOW';
        riskScore = (Math.random() * 0.2 + 0.05).toFixed(2);  // 0.05 - 0.25
        avgSleep = (Math.random() * 2 + 7).toFixed(1);        // 7.0 - 9.0 hours
        avgHRV = Math.floor(Math.random() * 20 + 65);         // 65 - 85 ms
        daysMonitored = Math.floor(Math.random() * 20 + 15);  // 15 - 35 days
    }
    
    // Determine sleep quality based on sleep hours
    let sleepQuality;
    if (avgSleep >= 7) {
        sleepQuality = '😊 Good';
    } else if (avgSleep >= 6) {
        sleepQuality = '😐 Fair';
    } else {
        sleepQuality = '😴 Poor';
    }
    
    // Determine HRV status based on HRV value
    let hrvStatus;
    if (avgHRV >= 60) {
        hrvStatus = '✅ Healthy';
    } else if (avgHRV >= 45) {
        hrvStatus = '🟡 Moderate';
    } else {
        hrvStatus = '⚠️ Stressed';
    }
    
    // Log to console so you can see what's happening
    console.log(`📊 Generated: ${risk} risk | Score: ${riskScore} | Sleep: ${avgSleep}h | HRV: ${avgHRV}ms`);
    
    return {
        risk: risk,
        riskScore: riskScore,
        avgSleep: avgSleep,
        avgHRV: avgHRV,
        daysMonitored: daysMonitored,
        sleepQuality: sleepQuality,
        hrvStatus: hrvStatus
    };
}

// Generate trend data based on risk level
function generateTrendData(riskLevel) {
    const dates = [];
    const scores = [];
    
    for (let i = 6; i >= 0; i--) {
        let d = new Date();
        d.setDate(d.getDate() - i);
        dates.push(d.toLocaleDateString());
        
        let baseScore;
        if (riskLevel === 'HIGH') {
            baseScore = 0.65 + Math.random() * 0.25;
        } else if (riskLevel === 'MEDIUM') {
            baseScore = 0.30 + Math.random() * 0.25;
        } else {
            baseScore = 0.05 + Math.random() * 0.20;
        }
        scores.push(baseScore);
    }
    
    return { dates: dates, scores: scores };
}

// Get recommendations based on risk level
function getRecommendations(riskLevel) {
    if (riskLevel === 'HIGH') {
        return [
            '😥 Consider talking to a counselor immediately',
            '😴 Try to get at least 7 hours of sleep tonight',
            '🧘 Practice deep breathing for 5 minutes',
            '📱 Avoid screens 1 hour before bedtime',
            '🚶 Take a 10-minute walk to reduce stress'
        ];
    } else if (riskLevel === 'MEDIUM') {
        return [
            '🚶 Take a 15-minute walk today',
            '💧 Stay hydrated - drink 8 glasses of water',
            '📵 Reduce screen time before bed',
            '🧘 Try 5 minutes of meditation',
            '😊 Practice gratitude journaling'
        ];
    } else {
        return [
            '👍 Keep up the good work!',
            '🏋️ Maintain your exercise routine',
            '🥗 Eat balanced meals',
            '😊 Continue your healthy habits',
            '🌟 You\'re doing great!'
        ];
    }
}

// Get recent messages
function getRecentMessages() {
    return [
        { time: 'Today, 9:15 AM', text: '🌟 Great job! Your sleep has improved.', type: 'success' },
        { time: 'Yesterday, 2:30 PM', text: '💪 You reached 8000 steps!', type: 'info' },
        { time: '2 days ago', text: '😊 Your stress level is lower.', type: 'success' }
    ];
}

// Update the risk card with beautiful colors
function updateRiskCard(riskLevel, riskScore) {
    const colors = RISK_COLORS[riskLevel];
    const cardBody = document.getElementById('riskCardBody');
    const riskEl = document.getElementById('riskLevel');
    const scoreEl = document.getElementById('riskScore');
    const indicatorEl = document.getElementById('riskIndicator');
    const riskCard = document.getElementById('riskCard');
    
    // Update card background with gradient
    cardBody.style.background = colors.background;
    cardBody.style.boxShadow = colors.boxShadow;
    cardBody.style.border = `2px solid ${colors.borderColor}`;
    cardBody.style.borderRadius = '12px';
    
    // Update risk level text
    riskEl.textContent = `${colors.icon} ${riskLevel}`;
    riskEl.style.color = colors.textColor;
    
    // Update risk score
    scoreEl.textContent = `Score: ${riskScore}`;
    scoreEl.style.color = colors.textColor;
    
    // Update status indicator
    indicatorEl.textContent = `📌 ${colors.status}`;
    indicatorEl.style.color = 'rgba(255,255,255,0.9)';
    indicatorEl.style.fontWeight = '500';
    
    // Add pulse animation for HIGH risk
    if (riskLevel === 'HIGH') {
        cardBody.style.animation = 'pulse 2s infinite';
    } else {
        cardBody.style.animation = 'none';
    }
}

// Add CSS animations
function addStyles() {
    const style = document.createElement('style');
    style.textContent = `
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        @keyframes glow {
            0% { box-shadow: 0 0 20px rgba(220, 53, 69, 0.4); }
            50% { box-shadow: 0 0 40px rgba(220, 53, 69, 0.8); }
            100% { box-shadow: 0 0 20px rgba(220, 53, 69, 0.4); }
        }
        
        .risk-card-high {
            animation: glow 2s infinite;
        }
    `;
    document.head.appendChild(style);
}

// Main function to update the dashboard
function updateDashboard() {
    console.log('🔄 Updating dashboard...');
    
    // Generate all data
    const data = generateRandomData();
    const trend = generateTrendData(data.risk);
    const recommendations = getRecommendations(data.risk);
    const messages = getRecentMessages();
    
    // =============================================
    // UPDATE RISK LEVEL CARD WITH COLORS
    // =============================================
    updateRiskCard(data.risk, data.riskScore);
    
    // =============================================
    // UPDATE SLEEP CARD
    // =============================================
    document.getElementById('avgSleep').textContent = `${data.avgSleep} h`;
    document.getElementById('sleepQuality').textContent = data.sleepQuality;
    
    // =============================================
    // UPDATE HRV CARD
    // =============================================
    document.getElementById('avgHRV').textContent = `${data.avgHRV} ms`;
    document.getElementById('hrvStatus').textContent = data.hrvStatus;
    
    // =============================================
    // UPDATE DAYS MONITORED CARD
    // =============================================
    document.getElementById('daysMonitored').textContent = data.daysMonitored;
    document.getElementById('monitorNote').textContent = `📊 ${data.daysMonitored} days tracked`;
    
    // =============================================
    // UPDATE CHART
    // =============================================
    const chartColors = {
        HIGH: '#dc3545',
        MEDIUM: '#ffc107',
        LOW: '#28a745'
    };
    
    let trace = {
        x: trend.dates,
        y: trend.scores,
        type: 'scatter',
        mode: 'lines+markers',
        name: 'Risk Score',
        line: {
            color: chartColors[data.risk],
            width: 3
        },
        marker: {
            size: 8,
            color: chartColors[data.risk]
        }
    };
    
    Plotly.newPlot('riskChart', [trace], {
        height: 300,
        margin: { t: 20, r: 20, l: 40, b: 40 },
        yaxis: {
            title: 'Risk Score',
            range: [0, 1],
            gridcolor: '#e9ecef'
        },
        xaxis: {
            gridcolor: '#e9ecef'
        },
        plot_bgcolor: '#ffffff',
        paper_bgcolor: '#ffffff'
    });
    
    // =============================================
    // UPDATE RECOMMENDATIONS
    // =============================================
    let recList = document.getElementById('recommendationsList');
    recList.innerHTML = '';
    recommendations.forEach(rec => {
        let li = document.createElement('li');
        li.className = 'list-group-item';
        if (data.risk === 'HIGH') {
            li.classList.add('list-group-item-danger');
        } else if (data.risk === 'MEDIUM') {
            li.classList.add('list-group-item-warning');
        } else {
            li.classList.add('list-group-item-success');
        }
        li.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${rec}`;
        recList.appendChild(li);
    });
    
    // =============================================
    // UPDATE MESSAGES
    // =============================================
    let msgDiv = document.getElementById('messagesList');
    msgDiv.innerHTML = '';
    messages.forEach(msg => {
        let div = document.createElement('div');
        div.className = `alert alert-${msg.type} alert-dismissible fade show`;
        div.innerHTML = `<small>${msg.time}</small><br><strong>${msg.text}</strong>`;
        msgDiv.appendChild(div);
    });
    
    console.log(`✅ Dashboard updated! Showing: ${data.risk} risk`);
}

// =============================================
// FORCE HIGH RISK ON FIRST LOAD
// =============================================
function forceHighRiskOnFirstLoad() {
    if (!sessionStorage.getItem('dashboard_loaded')) {
        sessionStorage.setItem('dashboard_loaded', 'true');
        console.log('🔴 FIRST LOAD: Showing HIGH risk');
        
        // Force HIGH risk data
        const highData = {
            risk: 'HIGH',
            riskScore: (Math.random() * 0.3 + 0.65).toFixed(2),
            avgSleep: (Math.random() * 2 + 3.5).toFixed(1),
            avgHRV: Math.floor(Math.random() * 15 + 30),
            daysMonitored: Math.floor(Math.random() * 10 + 5),
            sleepQuality: '😴 Poor',
            hrvStatus: '⚠️ Stressed'
        };
        
        // Update with HIGH data
        updateRiskCard('HIGH', highData.riskScore);
        document.getElementById('avgSleep').textContent = `${highData.avgSleep} h`;
        document.getElementById('sleepQuality').textContent = highData.sleepQuality;
        document.getElementById('avgHRV').textContent = `${highData.avgHRV} ms`;
        document.getElementById('hrvStatus').textContent = highData.hrvStatus;
        document.getElementById('daysMonitored').textContent = highData.daysMonitored;
        document.getElementById('monitorNote').textContent = `📊 ${highData.daysMonitored} days tracked`;
        
        // Update chart with HIGH data
        const trend = generateTrendData('HIGH');
        let trace = {
            x: trend.dates,
            y: trend.scores,
            type: 'scatter',
            mode: 'lines+markers',
            name: 'Risk Score',
            line: { color: '#dc3545', width: 3 },
            marker: { size: 8, color: '#dc3545' }
        };
        
        Plotly.newPlot('riskChart', [trace], {
            height: 300,
            margin: { t: 20, r: 20, l: 40, b: 40 },
            yaxis: { title: 'Risk Score', range: [0, 1], gridcolor: '#e9ecef' },
            xaxis: { gridcolor: '#e9ecef' },
            plot_bgcolor: '#ffffff',
            paper_bgcolor: '#ffffff'
        });
        
        // Update recommendations
        const recommendations = getRecommendations('HIGH');
        let recList = document.getElementById('recommendationsList');
        recList.innerHTML = '';
        recommendations.forEach(rec => {
            let li = document.createElement('li');
            li.className = 'list-group-item list-group-item-danger';
            li.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${rec}`;
            recList.appendChild(li);
        });
        
        return true;
    }
    return false;
}

// =============================================
// INITIALIZE DASHBOARD
// =============================================
document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 Dashboard loading...');
    
    // Add styles
    addStyles();
    
    // Try to show HIGH on first load
    const highShown = forceHighRiskOnFirstLoad();
    
    // If not first load, use normal random generation
    if (!highShown) {
        updateDashboard();
    }
    
    // Update every 30 seconds
    setInterval(function() {
        updateDashboard();
    }, 3600000);
    
    console.log('✅ Dashboard ready!');
    console.log('📊 Risk levels: HIGH (33%), MEDIUM (33%), LOW (33%)');
});
</script>
{% endblock %}
