<!-- src/web/templates/login.html -->
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">🔐 Login to System</h4>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                
                <ul class="nav nav-tabs" id="loginTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="student-tab" data-bs-toggle="tab" data-bs-target="#student" type="button" role="tab">
                            🎓 Student Login
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="counselor-tab" data-bs-toggle="tab" data-bs-target="#counselor" type="button" role="tab">
                            👨‍⚕️ Counselor Login
                        </button>
                    </li>
                </ul>
                
                <div class="tab-content mt-3">
                    <!-- Student Login Tab -->
                    <div class="tab-pane fade show active" id="student" role="tabpanel">
                        <form method="POST" action="/login/student">
                            <div class="mb-3">
                                <label class="form-label">Student ID</label>
                                <input type="text" class="form-control" name="student_id" placeholder="deshan" required>
                                <small class="text-muted">Demo: deshan / des123</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" name="password" placeholder="des123" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login as Student</button>
                        </form>
                        <hr>
                        <div class="text-center">
                            <p>New student? <a href="/register">Register here</a></p>
                        </div>
                    </div>
                    
                    <!-- Counselor Login Tab -->
                    <div class="tab-pane fade" id="counselor" role="tabpanel">
                        <form method="POST" action="/login/counselor">
                            <div class="mb-3">
                                <label class="form-label">Counselor ID</label>
                                <input type="text" class="form-control" name="counselor_id" placeholder="jhonwick" required>
                                <small class="text-muted">Demo: jhonwick / jhon123</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" name="password" placeholder="jhon123" required>
                            </div>
                            <button type="submit" class="btn btn-secondary w-100">Login as Counselor</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
